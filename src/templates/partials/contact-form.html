<form class="contact-form reveal" action="https://formsubmit.co/david@himre.com" method="POST">
  <input type="hidden" name="_subject" value="New Hawaii Military Realty contact request">
  <input type="hidden" name="_template" value="table">
  <input class="contact-form__honeypot" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">

  <div class="contact-form__heading">
    <div class="eyebrow-mini">Send a Message</div>
    <h3>Tell us how we can help</h3>
    <p>Share a few details and we’ll follow up with clear next steps.</p>
  </div>

  <div class="contact-form__fields">
    <div class="contact-form__field">
      <label for="contact-name">Name</label>
      <input id="contact-name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="contact-form__field">
      <label for="contact-email">Email</label>
      <input id="contact-email" name="email" type="email" autocomplete="email" required>
    </div>
    <div class="contact-form__field">
      <label for="contact-phone">Phone <span>(optional)</span></label>
      <input id="contact-phone" name="phone" type="tel" autocomplete="tel">
    </div>
    <div class="contact-form__field">
      <label for="contact-topic">I’m looking to</label>
      <select id="contact-topic" name="interest">
        <option value="Buy a home">Buy a home</option>
        <option value="Sell a home">Sell a home</option>
        <option value="Relocate to Oahu">Relocate to Oahu</option>
        <option value="Property management">Property management</option>
        <option value="Something else">Something else</option>
      </select>
    </div>
    <div class="contact-form__field contact-form__field--wide">
      <label for="contact-message">How can we help?</label>
      <textarea id="contact-message" name="message" rows="5" required></textarea>
    </div>
  </div>

  <button class="btn btn-primary contact-form__submit" type="submit">Send Message</button>
</form>
